<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1e40af" opacity="0.1"/>
  
  <!-- Book spine -->
  <path d="M 30 25 L 35 25 L 35 75 L 30 75 Q 25 75 25 70 L 25 30 Q 25 25 30 25" fill="#1e40af"/>
  
  <!-- Book pages -->
  <rect x="37" y="25" width="25" height="50" fill="#3b82f6" rx="2"/>
  <rect x="39" y="27" width="21" height="46" fill="#ffffff" rx="1"/>
  
  <!-- Reading lines on page -->
  <line x1="43" y1="32" x2="56" y2="32" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="38" x2="56" y2="38" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="43" y1="44" x2="56" y2="44" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="43" y1="50" x2="56" y2="50" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="43" y1="56" x2="56" y2="56" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="43" y1="62" x2="53" y2="62" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Right page -->
  <rect x="63" y="25" width="25" height="50" fill="#3b82f6" rx="2"/>
  <rect x="65" y="27" width="21" height="46" fill="#ffffff" rx="1"/>
  
